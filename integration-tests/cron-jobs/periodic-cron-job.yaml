kind: CronJob
apiVersion: batch/v1
metadata:
  name: periodic-integration-test
  namespace: konflux-ui-tenant
spec:
  schedule: '30 12 * * *'
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: trigger-e2e-scenario
              image: 'quay.io/konflux-ci/task-runner:v1'
              imagePullPolicy: Always
              command:
                - /bin/bash
                - '-c'
              args:
                - |
                  #!/bin/bash
                  set -euo pipefail

                  export KONFLUX_SCENARIO_NAME="konflux-ui-periodic-main"
                  export KONFLUX_TENANT_NAME="konflux-ui-tenant"
                  export KONFLUX_APPLICATION_NAME="konflux-ui"
                  export KONFLUX_COMPONENT_NAME="konflux-ui"                  

                  echo -e "[INFO] Triggering test scenario ${KONFLUX_SCENARIO_NAME}"

                  kubectl -n "${KONFLUX_TENANT_NAME}" test.appstudio.openshift.io/run="${KONFLUX_SCENARIO_NAME}"

                  echo "[INFO] Integration Service E2E tests successfully triggered!"
          restartPolicy: Never
          serviceAccountName: default
          serviceAccount: default